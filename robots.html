<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الروبوتات - معرض 3D</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>
    <header>
        <h1>قسم الروبوتات الذكية</h1>
        <nav>
            <a href="index.html">الرئيسية</a> | 
            <a href="robots.html">الروبوتات</a> | 
            <a href="airplanes.html">الطائرات</a>
        </nav>
    </header>

    <main>
        <h2>تقنيات الذكاء الاصطناعي والروبوت</h2>
        <p>استكشف أحدث ما توصلت إليه التكنولوجيا في عالم تصاميم الروبوتات الحديثة.</p>

        <!-- مجسم 3D تفاعلي للروبوت -->
        <div class="viewer-box">
            <h3>مجسم آلي تفاعلي 3D:</h3>
            <model-viewer src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb" alt="مجسم روبوت 3D" auto-rotate camera-controls style="width: 100%; height: 350px; border-radius: 10px;"></model-viewer>
        </div>

        <div class="image-box">
            <h3>صورة توضيحية للروبوت:</h3>
            <img src="https://images.unsplash.com/photo-1546776310-eef45dd6d63c?w=500" alt="صورة روبوت ذكي" width="400">
        </div>
    </main>
</body>
</html>
